<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>parcial</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <h1>parcial API del clima</h1>
    <input type="text" id="cityInput" placeholder="Escribe una ciudad...">
    <button id="searchBtn">Buscar</button>
    

    <div id="weatherResult" class="weather-card">
      <h2 id="cityName"></h2>
      <p id="temperature"></p>
      <p id="description"></p>
      <img id="icon" alt="icono del clima">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
